name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Keep `main` runs intact so every merged commit keeps its own CLI artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-toolchain.toml`.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  lint:
    name: Format & dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - parallel:
          - name: Checkout repository
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            with:
              persist-credentials: false
          - name: Install cargo-deny and cargo-machete
            uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
            with:
              tool: cargo-deny,cargo-machete

      # Deliberately left out of the block above: rustup populates the same
      # `~/.cargo/bin` that `install-action` writes its binaries into.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Everything `rust-toolchain.toml` asks for -- components and targets
          # alike -- so no parallel step below has rustup fetch anything on
          # demand.
          targets: thumbv7m-none-eabi,wasm32-unknown-unknown
          components: rustfmt, clippy, rust-analyzer

      # None of the three checks compiles anything, and the toolchain above
      # leaves rustup nothing to fetch, so they contend over no shared lock.
      - parallel:
          - name: Check formatting
            run: cargo fmt --all -- --check
          - name: Check advisories, licenses and bans
            run: cargo deny check
          - name: Check for unused dependencies
            run: cargo machete

  ast-grep:
    name: AST grep rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install ast-grep
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: ast-grep
      - name: Run ast-grep tests
        run: ast-grep test --skip-snapshot-tests
      - name: Run ast-grep prohibition rules
        run: ast-grep scan --min-severity warning .

  portability:
    name: Library / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std (thumbv7m-none-eabi)
            target: thumbv7m-none-eabi
            packages: -p sekai-util -p sekai-core -p sekai-anvil -p sekai-nbt
          - name: wasm (wasm32-unknown-unknown)
            target: wasm32-unknown-unknown
            packages: -p sekai-util -p sekai-core -p sekai-anvil -p sekai-nbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy
          cache-key: ${{ matrix.target }}

      # `--all-targets` is deliberately omitted: test and bench harnesses pull
      # in `std`, which these targets do not provide.
      - name: Clippy
        run: cargo clippy ${{ matrix.packages }} --target ${{ matrix.target }} --no-default-features -- -D warnings

  features:
    name: Feature combinations (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ""
          components: clippy
          cache-key: features

      # After the cache step on purpose: `rust-cache` restores `~/.cargo/bin`,
      # which is where `install-action` drops the binary.
      - name: Install cargo-hack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-hack

      # `--each-feature` walks default, `--no-default-features`, every single
      # backend feature, and `--all-features` per package. Only the crates that
      # declare backend features are listed; the pure crates have none, and
      # their default-feature clippy pass already runs in `test`.
      # `--no-dev-deps` keeps dev-only dependencies (tokio, criterion) out of
      # feature resolution.
      - name: Check feature combinations
        run: cargo hack clippy -p sekai-storage -p sekai-app -p sekai-cli --each-feature --no-dev-deps -- -D warnings

  # Split from `dist` below so the checks and the release build get a runner
  # each.
  rustdoc:
    name: API docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ""
          components: ""
          cache-key: rustdoc

      - name: Check rustdoc warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Keep in sync with the `dist` matrix below.
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Keyed apart from `dist`: this job only ever fills the dev profile, and
      # a cache shared with the release build would thrash on every run.
      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy
          cache-key: test-${{ matrix.target }}

      # After the cache step on purpose: `rust-cache` restores `~/.cargo/bin`,
      # which is where `install-action` drops the binary.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-nextest

      # Kept sequential: both invocations build the dev profile, so they would
      # queue on the same `target/<triple>/debug` cargo build lock anyway.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --target ${{ matrix.target }}

  docs:
    name: User guide (mdbook)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check doc links and guide parity
        run: python3 .github/scripts/check-docs.py

      - name: Install mdbook
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: mdbook

      - name: Build user guide (en/ja)
        run: |
          mdbook build book/en -d "$PWD/dist/en"
          mdbook build book/ja -d "$PWD/dist/ja"
          cp book/index.html dist/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy-pages:
    name: Deploy user guide
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  # Intentionally not gated on `test`: waiting would give back exactly the wall
  # clock the split was meant to save, and a red run is already flagged as red.
  dist:
    name: CLI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      # Keep in sync with the `test` matrix above.
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: ""
          cache-key: dist-${{ matrix.target }}

      - name: Build and package CLI
        uses: ./.github/actions/package-cli
        with:
          target: ${{ matrix.target }}

      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          tar -xzf "sekai-${{ matrix.target }}.tar.gz" -C "$SMOKE"
          BIN="$SMOKE/sekai"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$SMOKE/sekai.exe"; fi
          "$BIN" --help >/dev/null
          # Only `backup` creates the store; every other command must fail
          # on a missing store without leaving anything behind (issue #80).
          if "$BIN" --store "$SMOKE/store" list --json >/dev/null 2>&1; then
            echo "list on a missing store must fail" >&2
            exit 1
          fi
          [ ! -e "$SMOKE/store" ]
          mkdir -p "$SMOKE/world"
          "$BIN" --store "$SMOKE/store" backup "$SMOKE/world" --json | grep -q '"status":"ok"'
          "$BIN" --store "$SMOKE/store" list --json | grep -q '"command":"list","status":"ok"'
          "$BIN" --store "$SMOKE/store" gc --dry-run --json | grep -q '"status":"ok"'

      - name: Upload CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sekai-${{ matrix.target }}
          path: sekai-${{ matrix.target }}.tar.gz
          if-no-files-found: error
