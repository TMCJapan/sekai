name: Bench

# Never a merge gate: numbers are machine-dependent. Scheduled and manual
# runs for trend observation; compare before/after on the same runner.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-toolchain.toml`.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  bench:
    name: Criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run micro benches
        run: cargo bench -p sekai-anvil -p sekai-nbt -p sekai-core

      - name: Run integration benches
        run: cargo bench -p sekai-app --bench commit

      - name: Upload criterion output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
