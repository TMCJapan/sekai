name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-toolchain.toml`.
  RUST_TOOLCHAIN: 1.99.1

# Split from `clippy.yaml` so nextest gets its own runner and timeout budget
# instead of sharing a job with clippy.
jobs:
  test:
    name: ${{ matrix.name }} (${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Keep the OS/target pairs in sync with the `clippy` matrix in
      # `clippy.yaml` and the `dist` matrix in `ci.yaml`.
      # Each extra entry is one disjoint `cargo hack --partition` slice; the
      # slices for an OS together cover the same runs as one unpartitioned job.
      # Windows gets three slices because it dominates the critical path; the
      # other runners get two, and macOS stays at two to fit GitHub's five-job
      # macOS limit (shared with `clippy` and `dist`).
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            partition: "1/2"
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            partition: "2/2"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            partition: "1/2"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            partition: "2/2"
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            partition: "1/2"
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            partition: "2/2"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            partition: "1/2"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            partition: "2/2"
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            partition: "1/3"
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            partition: "2/3"
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            partition: "3/3"
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            partition: "1/3"
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            partition: "2/3"
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            partition: "3/3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Keyed apart from `clippy` and `dist`: this job only ever fills the dev
      # profile, and a cache shared with the release build or the lint workflow
      # would thrash on every run. Partitions deliberately share one key per
      # target: rust-cache saves dependency crates only, so per-partition keys
      # would duplicate the same cache without retaining the workspace
      # artifacts that actually differ. Only the last slice (app/cli, hence
      # every dependency) saves the cache; letting a lighter slice save first
      # would persist an incomplete set.
      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: ""
          cache-key: test-${{ matrix.target }}
          save-if: ${{ matrix.partition == '2/2' || matrix.partition == '3/3' }}

      # After the cache step on purpose: `rust-cache` restores `~/.cargo/bin`,
      # which is where `install-action` drops the binary.
      - name: Install cargo-nextest and cargo-hack
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-nextest,cargo-hack

      # The store-backed suites need `backend-sqlite`, so they are compiled out
      # of the combinations that do not provide it.
      - name: Test
        run: cargo hack --each-feature --partition ${{ matrix.partition }} nextest run --workspace --all-targets --target ${{ matrix.target }}
