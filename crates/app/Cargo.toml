[package]
name = "sekai-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestration library for Sekai, a deduplicated Minecraft world version control tool"
keywords = ["minecraft", "version-control"]

[lints]
workspace = true

[dependencies]
sekai-anvil.workspace = true
sekai-core.workspace = true
sekai-storage.workspace = true
sekai-util.workspace = true
sekai-world.workspace = true
thiserror.workspace = true

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "checkout"
harness = false

[[bench]]
name = "diff"
harness = false

[dev-dependencies]
criterion.workspace = true
miniz_oxide.workspace = true
sekai-storage = { workspace = true, features = ["testing"] }
sekai-storage-local.workspace = true
sekai-world-local.workspace = true
tempfile.workspace = true
# Tests and benches drive the async flows on a runtime; the library itself
# names none.
tokio = { workspace = true, features = ["time"] }
