[package]
name = "sekai-app"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Orchestration library for Sekai, a deduplicated Minecraft world backup tool"
keywords = ["minecraft", "backup"]

[lints]
workspace = true

[features]
default = ["backend-sqlite"]
backend-sqlite = ["dep:sekai-storage-sqlite", "sekai-storage/backend-sqlite"]
backend-mysql = ["sekai-storage/backend-mysql"]
backend-postgres = ["sekai-storage/backend-postgres"]

[dependencies]
sekai-anvil.workspace = true
sekai-core.workspace = true
sekai-nbt.workspace = true
sekai-storage.workspace = true
sekai-storage-sqlite = { workspace = true, optional = true }
sekai-world.workspace = true
thiserror.workspace = true
tokio.workspace = true

[[bench]]
name = "backup"
harness = false
required-features = ["backend-sqlite"]

[[bench]]
name = "rollback"
harness = false
required-features = ["backend-sqlite"]

[[bench]]
name = "diff"
harness = false
required-features = ["backend-sqlite"]

[[bench]]
name = "gc_scan"
harness = false
required-features = ["backend-sqlite"]

[dev-dependencies]
criterion.workspace = true
miniz_oxide.workspace = true

[package.metadata.cargo-machete]
ignored = ["sekai-core", "sekai-storage", "sekai-world"]
