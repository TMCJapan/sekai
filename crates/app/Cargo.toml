[package]
name = "sekai-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orchestration library for Sekai, a deduplicated Minecraft world version control tool"
keywords = ["minecraft", "version-control"]

[lints]
workspace = true

[features]
default = ["backend-local"]
backend-local = ["dep:sekai-world-local"]

[dependencies]
sekai-anvil.workspace = true
sekai-core.workspace = true
sekai-storage.workspace = true
sekai-world.workspace = true
sekai-world-local = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true

[[bench]]
name = "commit"
harness = false
required-features = ["backend-local"]

[[bench]]
name = "checkout"
harness = false
required-features = ["backend-local"]

[[bench]]
name = "diff"
harness = false
required-features = ["backend-local"]

[dev-dependencies]
criterion.workspace = true
miniz_oxide.workspace = true
sekai-storage = { workspace = true, features = ["testing"] }
sekai-storage-local.workspace = true
tempfile.workspace = true
