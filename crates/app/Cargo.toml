[package]
name = "sekai-app"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Orchestration library for Sekai, a deduplicated Minecraft world version control tool"
keywords = ["minecraft", "version-control"]

[lints]
workspace = true

[features]
default = ["backend-local"]
backend-local = ["dep:sekai-storage-local"]

[dependencies]
sekai-anvil.workspace = true
sekai-core.workspace = true
sekai-storage.workspace = true
sekai-storage-local = { workspace = true, optional = true }
sekai-world.workspace = true
thiserror.workspace = true
tokio.workspace = true

[[bench]]
name = "commit"
harness = false
required-features = ["backend-local"]

[[bench]]
name = "checkout"
harness = false
required-features = ["backend-local"]

[[bench]]
name = "diff"
harness = false
required-features = ["backend-local"]

[[bench]]
name = "gc_scan"
harness = false
required-features = ["backend-local"]

[dev-dependencies]
criterion.workspace = true
miniz_oxide.workspace = true
tempfile.workspace = true

[package.metadata.cargo-machete]
ignored = ["sekai-core", "sekai-storage", "sekai-world"]
