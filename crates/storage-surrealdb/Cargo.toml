[package]
name = "sekai-storage-surrealdb"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "SurrealDB/SurrealKV metadata and blob backend for Sekai"
keywords = ["minecraft", "version-control", "storage", "surrealdb"]

[lints]
workspace = true

[dependencies]
sekai-core.workspace = true
sekai-storage.workspace = true
surrealdb = { version = "3.3.5", default-features = false, features = [
  "parse",
  "rustls",
  "kv-surrealkv",
] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true