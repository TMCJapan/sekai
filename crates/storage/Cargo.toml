[package]
name = "sekai-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Backend-neutral metadata and blob storage boundaries for Sekai"
keywords = ["minecraft", "version-control", "storage"]

[lints]
workspace = true

[features]

[dependencies]
sekai-core.workspace = true
thiserror.workspace = true
# `rt` carries `spawn_blocking`, which the file CAS uses for its filesystem
# pass. Inheriting the workspace tokio would drag in `rt-multi-thread`, which
# tokio rejects on wasm, and `features` precludes inheritance here anyway.
tokio = { version = "1", default-features = false, features = ["rt"] }
