[package]
name = "sekai-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Content-addressed and metadata storage backends for Sekai"
keywords = ["minecraft", "backup", "storage"]

[lints]
workspace = true

[features]
default = ["backend-sqlite"]
backend-sqlite = ["dep:sqlx", "dep:tokio"]
backend-mysql = []
backend-postgres = []

[dependencies]
sekai-core.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
tokio.workspace = true
