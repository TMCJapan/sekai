[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/cli",
  "crates/nbt",
  "crates/engine",
  "crates/mca",
  "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
missing_errors_doc = "allow"

[workspace.dependencies]
sekai-core = { path = "crates/core" }
sekai-mca = { path = "crates/mca" }
sekai-storage = { path = "crates/storage" }

blake3 = "1"
fastnbt = "2"
flate2 = "1"
lz4-java-wrc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
