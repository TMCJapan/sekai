[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/cli",
  "crates/nbt",
  "crates/engine",
  "crates/mca",
  "crates/storage",
]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
missing_errors_doc = "allow"
