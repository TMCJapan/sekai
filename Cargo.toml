[workspace]
resolver = "3"
members = [
  "crates/anvil",
  "crates/nbt",
  "crates/core",
  "crates/storage",
  "crates/world",
  "crates/app",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
missing_errors_doc = "allow"

[workspace.dependencies]
sekai-anvil = { path = "crates/anvil" }
sekai-app = { path = "crates/app" }
sekai-core = { path = "crates/core" }
sekai-nbt = { path = "crates/nbt" }
sekai-storage = { path = "crates/storage" }
sekai-world = { path = "crates/world" }
