[advisories]
version = 2
# `paste` (unmaintained, not vulnerable) comes transitively via
# pulp <- nanocesu8 <- nanonbt. Revisit once upstream drops it.
# `instant` (via parking_lot <- sled) and `fxhash` (via sled) are
# unmaintained, not vulnerable; both are non-optional sled 0.34 deps.
# Revisit once sled drops them.
# `chrono` (unmaintained, not vulnerable) is a non-optional turso dep.
# Revisit once turso drops it.
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2024-0384",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2026-0543",
]

[sources]
allow-git = [
  "https://github.com/TMCJapan/nanonbt",
]

[licenses]
version = 2
# BSD-3-Clause covers `instant`, a non-optional transitive dep of sled
# (parking_lot <- sled). ISC covers `libloading`, a non-optional turso dep.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC"]

# `cfg_block` (a turso dep) ships the Apache-2.0 text as `license-file`
# instead of a `license` expression, so cargo-deny cannot read it.
[[licenses.clarify]]
name = "cfg_block"
expression = "Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
skip = [
  { name = "syn", version = "2.0.119" },
]
