[advisories]
version = 2
# `paste` (unmaintained, not vulnerable) comes transitively via
# pulp <- nanocesu8 <- nanonbt. Revisit once upstream drops it.
# `instant` (via parking_lot <- sled) and `fxhash` (via sled) are
# unmaintained, not vulnerable; both are non-optional sled 0.34 deps.
# Revisit once sled drops them.
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2024-0384",
  "RUSTSEC-2025-0057",
]

[sources]
allow-git = [
  "https://github.com/TMCJapan/nanonbt",
  "https://github.com/launchbadge/sqlx",
]

[licenses]
version = 2
# BSD-3-Clause covers `instant`, a non-optional transitive dep of sled
# (parking_lot <- sled).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause"]

[bans]
multiple-versions = "warn"
skip = [
  { name = "hashbrown", version = "0.16.1" },
  { name = "syn", version = "2.0.119" },
]
